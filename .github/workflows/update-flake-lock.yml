name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update flake.lock
        run: nix flake update

      - name: Test module build
        run: |
          nix build --print-build-logs --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; };
              hm = flake.inputs.home-manager;
              cfg = hm.lib.homeManagerConfiguration {
                inherit pkgs;
                modules = [
                  flake.homeManagerModules.oac
                  {
                    home.username = "ci";
                    home.homeDirectory = "/tmp/ci-home";
                    home.stateVersion = "24.11";
                    programs.opencode.oac.enable = false;
                  }
                ];
              };
            in
            cfg.activationPackage
          '

      - name: Commit flake.lock if changed
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No flake.lock changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(nix): update flake.lock"
          git push
